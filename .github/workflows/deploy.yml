# Deploys `main` to Cloudflare: after CI passes on a push to main, or on a
# manual dispatch. scripts/deploy.ts fetches every secret from Doppler
# (etsy-shop-mcp/prd), applies infra/ with Terraform, then runs `wrangler
# deploy`. The only secret GitHub holds is DOPPLER_TOKEN, a read-only Doppler
# service token stored in the "production" environment, which accepts
# deployments from main only (.github/environments/production.json, applied by
# `npm run bootstrap`). Without that token the run skips with a warning.
#
# Two jobs: `gate` decides, with no concurrency group, so a run it turns away
# never joins the `deploy` group, which serializes every Terraform state write.
# The deploy job re-checks the tip, because "Re-run failed jobs" reuses the gate's
# outputs; such a re-run of an older run still joins the group first and can
# displace a pending deploy of the tip, so it warns (README runbook).
# See .minerva/reference/deploy.md. Shape pinned by tests/deploy-workflow.test.ts.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Deploy with ALLOWLIST_BOOTSTRAP on, to look up her Etsy ids (README).
        type: boolean
        default: false
      allow_destroy:
        description: Apply a Terraform plan that deletes or replaces a resource. Only on purpose.
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

jobs:
  gate:
    # A dispatch of main, or a CI run for a push to main (never a PR's run) that fully succeeded.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Decide whether to deploy
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # A re-run of an older commit's CI must never roll production back.
          tip="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$tip" != "$SHA" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::warning::$SHA is no longer the tip of main ($tip), so this dispatch does not deploy. Dispatch again from main."
            else
              echo "::notice::$SHA is no longer the tip of main ($tip), so it is not deployed."
            fi
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A dispatch skips the CI trigger, so it requires the merge gate itself:
          # the latest ci-pass check run from GitHub Actions (app 15368) must have succeeded.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            conclusion="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci-pass&filter=latest" \
              --jq '[.check_runs[] | select(.app.id == 15368)] | sort_by(.started_at) | last | .conclusion // ""')"
            if [ "$conclusion" != "success" ]; then
              echo "::error::ci-pass has not succeeded on $SHA (found '${conclusion}'), so it is not deployed."
              exit 1
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      # One deploy at a time. A newer tip's deploy may replace a still-pending one.
      group: deploy
      cancel-in-progress: false
    steps:
      # Re-checked here, after the concurrency group is acquired: "Re-run failed jobs"
      # reuses the gate job's old outputs, and that must never roll production back.
      - name: Re-check the tip of main and require DOPPLER_TOKEN
        id: ready
        env:
          HAS_TOKEN: ${{ secrets.DOPPLER_TOKEN != '' }}
          SHA: ${{ needs.gate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tip="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$tip" != "$SHA" ]; then
            echo "::warning::$SHA is no longer the tip of main ($tip), so it is not deployed. If this was a re-run, it may have displaced a pending deploy of the tip: run gh workflow run deploy.yml."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::DOPPLER_TOKEN is not set in the production environment, so this run does not deploy. Run npm run bootstrap (README)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.deploy == 'true'
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.deploy == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      # No secret is in the env here. npm 11 runs install scripts only for the
      # packages package.json's allowScripts names (pinned esbuild and workerd).
      - if: steps.ready.outputs.deploy == 'true'
        run: npm ci
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.ready.outputs.deploy == 'true'
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      # DOPPLER_TOKEN is in this step's env only, but it is not isolated from the
      # dependencies: an allowed install script ran earlier on this runner, and
      # scripts/deploy.ts itself loads `typescript` from node_modules while it holds
      # every fetched secret. The script masks each secret before printing anything.
      - if: steps.ready.outputs.deploy == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
          ALLOW_DESTROY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_destroy }}
        run: |
          args=()
          if [ "$BOOTSTRAP" = "true" ]; then args+=(--bootstrap); fi
          if [ "$ALLOW_DESTROY" = "true" ]; then args+=(--allow-destroy); fi
          node scripts/deploy.ts "${args[@]}"
