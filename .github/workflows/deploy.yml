# Deploys `main` to Cloudflare after CI has passed on it. Without the
# CLOUDFLARE_API_TOKEN repository secret it skips with a notice, so forks and a
# not-yet-configured repo stay green. Secrets for the Worker itself are set once
# with `wrangler secret put` (see README), never from here.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only a CI run for a push to main (never a PR's run) that fully succeeded.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to deploy
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so this run does not deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A re-run of an older commit's CI must never roll production back.
          tip="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::notice::$HEAD_SHA is no longer the tip of main ($tip), so it is not deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.deploy == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.deploy == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.deploy == 'true'
        run: npm ci
      # The Cloudflare token exists only in this step, never during dependency installs.
      - if: steps.gate.outputs.deploy == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
